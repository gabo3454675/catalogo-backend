databases:
  - name: kronos-db
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: kronos-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run prisma:generate && npm run build
    preDeployCommand: npm run prisma:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kronos-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: MEDIA_WORKER_URL
        value: https://kronos-images.glonga10.workers.dev
      - key: MEDIA_UPLOAD_TOKEN
        sync: false
      - key: CATALOG_SYNC_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        value: glonga10@gmail.com
      - key: ADMIN_TOKEN
        sync: false
