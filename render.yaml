databases:
  - name: kronos-db
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: kronos-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run prisma:generate && npm run build
    preDeployCommand: npm run prisma:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kronos-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: BCV_API_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
  - type: cron
    name: kronos-catalog-sync
    runtime: node
    region: oregon
    schedule: "0 6 * * 0"
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run sync:catalog
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kronos-db
          property: connectionString
      - key: BCV_API_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
